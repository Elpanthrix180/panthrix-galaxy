# Compila el mod en GitHub y guarda los .jar (Forge y Fabric).
#  - En cada push: los .jar aparecen en la pestaña "Actions" → la ejecución → "Artifacts".
#  - Al crear una etiqueta v1.0.0 (o v1.0.1...): además se crea una "Release" con los .jar.
#  - También a mano: Actions → "Compilar mod" → "Run workflow" → marcar "Crear Release".
#    La etiqueta se llama v + mod_version de gradle.properties (p. ej. v1.0.0).
#  - La Release lleva el .jar de Fabric solo si su compilación salió bien.
name: Compilar mod

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Crear Release con la versión de gradle.properties"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  forge:
    name: Forge
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar (Forge)
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Prueba de arranque (servidor Forge)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          timeout 900 ./gradlew runServer -Psmoke --no-daemon > forge-server.log 2>&1 || true
          grep "SMOKE TEST OK" forge-server.log || { grep -E -B2 -A25 "Exception|Error|FATAL|Mixin" forge-server.log | head -300; exit 1; }

      - name: Avisos del arranque (Forge)
        if: always()
        run: |
          grep -iE "panthrixsgalaxy|Parsing error|Couldn't parse|Failed to load|Unknown recipe|missing" forge-server.log | grep -iE "warn|error|fail|missing|unknown|couldn" | head -80 || true

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: panthrixsgalaxy-jar
          path: build/libs/*.jar
          if-no-files-found: error

  fabric:
    name: Fabric
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar (Fabric)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew -p fabric build --no-daemon 2>&1 | tee fabric-build.log

      - name: Resumen de errores (si falla)
        if: failure()
        run: |
          grep -E -A3 "error:" fabric-build.log | head -400 || true

      - name: Avisos de compilación (mixins de Fabric)
        run: |
          grep -iE "warning|Cannot find|Unable to locate|No refMap" fabric-build.log | grep -viE "deprecat|unchecked|removal" | head -60 || true

      - name: Prueba de arranque (servidor Fabric)
        run: |
          mkdir -p fabric/run-server && echo "eula=true" > fabric/run-server/eula.txt
          timeout 900 ./gradlew -p fabric runServer -Psmoke --no-daemon > fabric-server.log 2>&1 || true
          grep "SMOKE TEST OK" fabric-server.log || { grep -E -B2 -A25 "Exception|Error|FATAL|Mixin" fabric-server.log | head -300; exit 1; }

      - name: Avisos del arranque (Fabric)
        if: always()
        run: |
          grep -iE "panthrixsgalaxy|Parsing error|Couldn't parse|Failed to load|Unknown recipe|missing" fabric-server.log | grep -iE "warn|error|fail|missing|unknown|couldn" | head -80 || true

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: panthrixsgalaxy-fabric-jar
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
          if-no-files-found: error

  economy:
    name: Economy (Panthrix's Economy)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar (Economy)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew -p economy build --no-daemon 2>&1 | tee economy-build.log

      - name: Resumen de errores (si falla)
        if: failure()
        run: |
          grep -E -A3 "error:" economy-build.log | head -400 || true

      - name: Pruebas obligatorias (servidor Forge real)
        run: |
          mkdir -p economy/run && echo "eula=true" > economy/run/eula.txt
          # Semilla fija: la prueba es reproducible (el motivo de cada sitio descartado sale en el log)
          echo "level-seed=panthrix-economy" > economy/run/server.properties
          timeout 1200 ./gradlew -p economy runServer -Psmoke --no-daemon > economy-server.log 2>&1 || true
          grep "Panthrix's Economy\]" economy-server.log | grep -v " OK: " | head -60 || true
          grep "ECONOMY SMOKE TEST OK" economy-server.log || { grep -E -B2 -A25 "FALLO|Exception|Error|FATAL" economy-server.log | head -300; exit 1; }

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: panthrixseconomy-jar
          path: economy/build/libs/*.jar
          if-no-files-found: error

  transporte:
    name: Transporte Ibérico
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar (Transporte Ibérico)
        working-directory: transporte
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee ../transporte-build.log

      - name: Resumen de errores (si falla)
        if: failure()
        run: |
          grep -E -A3 "error:" transporte-build.log | head -400 || true

      - name: Pruebas del autobús (servidor Forge real)
        working-directory: transporte
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          timeout 900 ./gradlew runServer -Psmoke --no-daemon > ../transporte-server.log 2>&1 || true
          grep "Transporte Ibérico\]" ../transporte-server.log | head -60 || true
          grep "TRANSPORTE SMOKE TEST OK" ../transporte-server.log || { grep -E -B2 -A25 "FALLO|Exception|Error|FATAL" ../transporte-server.log | head -300; exit 1; }

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: transporteiberico-jar
          path: transporte/build/libs/transporteiberico-*.jar
          if-no-files-found: error

  release:
    name: Release
    needs: [forge, fabric, economy, transporte]
    if: always() && needs.forge.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.release)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descargar el .jar de Forge
        uses: actions/download-artifact@v4
        with:
          name: panthrixsgalaxy-jar
          path: jars

      - name: Descargar el .jar de Fabric (si se compiló)
        if: needs.fabric.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: panthrixsgalaxy-fabric-jar
          path: jars

      - name: Descargar el .jar de Economy (si se compiló)
        if: needs.economy.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: panthrixseconomy-jar
          path: jars

      - name: Descargar el .jar de Transporte Ibérico (si se compiló)
        if: needs.transporte.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: transporteiberico-jar
          path: jars

      - name: Leer la versión
        id: version
        run: echo "tag=v$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Crear la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Panthrixs Galaxy ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: jars/*.jar
          body_path: CHANGELOG.md
