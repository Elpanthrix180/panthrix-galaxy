# Compila el mod en GitHub y guarda el .jar.
#  - En cada push: el .jar aparece en la pestaña "Actions" → la ejecución → "Artifacts".
#  - Al crear una etiqueta v1.0.0 (o v1.0.1...): además se crea una "Release" con el .jar.
name: Compilar mod

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: panthrixsgalaxy-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Crear la Release (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          body_path: CHANGELOG.md
